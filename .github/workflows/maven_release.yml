name: Maven Release

# Publishes uniauth-spring-boot-starter to Maven Central and cuts the GitHub release.
# Everything else in the reactor sets skipPublishing: the provider, the console and the
# examples are demonstrations, not libraries.
#
# Release one Spring Boot line. `branch` selects the line: main = the latest Boot line,
# or a <major>.<minor> maintenance branch.
#
#   gh workflow run maven_release.yml \
#     -f branch=main -f releaseVersion=X.Y.Z.N -f nextVersion=X.Y.Z.(N+1)-SNAPSHOT
#
# Run the release-prep checklist first: this tags whatever is on the branch, and the tag
# freezes the docs, the README version and the changelog exactly as they are.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from (main = latest Boot line)'
        required: true
        default: 'main'
      releaseVersion:
        description: 'Release version (<boot-version>.<revision>, e.g. 4.0.8.1)'
        required: true
      nextVersion:
        description: 'Next development version (with -SNAPSHOT suffix)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release commit + tag, create the GitHub release
    # Inputs go through env, never inline in a `run` script.
    env:
      BRANCH: ${{ github.event.inputs.branch }}
      RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
      NEXT_VERSION: ${{ github.event.inputs.nextVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set Release Version
        run: |
          ./mvnw versions:set -DnewVersion="$RELEASE_VERSION" -Pdefault --no-transfer-progress
          # Keep the README install snippet in sync with the release (versions:set only
          # touches the POMs). README.adoc carries the version in the :uniauth-version:
          # attribute, so one substitution covers the whole document.
          sed -i -E "s#^:uniauth-version:.*#:uniauth-version: $RELEASE_VERSION#" README.adoc
          # The example chart's appVersion (default image tag + version label) tracks the
          # project version too.
          sed -i -E "s#^appVersion:.*#appVersion: \"$RELEASE_VERSION\"#" deploy/helm/uniauth/Chart.yaml

      - name: Verify Build
        run: ./mvnw --batch-mode verify -Pdefault --no-transfer-progress

      - name: Commit and Tag Release
        run: |
          git commit -am "Prepare release $RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"

      - name: Deploy to Maven Central
        run: ./mvnw --batch-mode clean deploy -Prelease -Dgpg.passphrase="${GPG_PASSPHRASE}" --no-transfer-progress
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set Next Development Version
        run: |
          ./mvnw versions:set -DnewVersion="$NEXT_VERSION" -Pdefault --no-transfer-progress
          sed -i -E "s#^appVersion:.*#appVersion: \"$NEXT_VERSION\"#" deploy/helm/uniauth/Chart.yaml
          git commit -am "Prepare for next development iteration: $NEXT_VERSION"

      - name: Push Changes
        run: git push origin "$BRANCH" && git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.releaseVersion }}
          name: Release ${{ github.event.inputs.releaseVersion }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
