server:
  port: 8090
  servlet:
    session:
      cookie:
        # Distinct per service. Cookies are scoped by host and NOT by port, so two Spring
        # applications on localhost:8080 and localhost:9000 share one JSESSIONID and each
        # silently overwrites the other's session. In an OAuth redirect that is fatal and
        # almost invisible: the provider's cookie replaces the client's, the client comes
        # back to a session with no saved authorization request, and the login fails with
        # nothing logged but a redirect to ?error.
        name: CONSOLESESSION

spring:
  application:
    name: uniauth-admin
  thymeleaf:
    # The console has no login template of its own — it uses the starter's chooser.
    check-template-location: true

# The applications this console administers. Each entry is a separate running application
# reached over its admin API; the token must match that application's
# uniauth.admin-api.token. Inject the real ones from the environment.
console:
  targets:
    - id: webapp
      name: UniAuth demo web app
      base-url: ${CONSOLE_TARGETS_0_BASE_URL:http://localhost:8080}
      token: ${CONSOLE_TARGETS_0_TOKEN:demo-admin-token}

uniauth:
  # The console signs its own administrators in with UniAuth. These are a separate
  # population from the users being administered — an account here grants no access to any
  # managed application, and vice versa.
  #
  # ---------------------------------------------------------------------------------------
  # admin/admin is a DEMO credential, and a worse one here than elsewhere in this repo.
  #
  # This console holds a token that creates accounts on every application it manages,
  # including accounts with ADMIN roles. Whoever signs in here can therefore grant
  # themselves administrator on the managed applications — the login below is a privilege
  # escalation path, not just a way into a dashboard.
  #
  # Anywhere that matters, override it with a real password from a Secret or the
  # environment, and use a real encoder:
  #
  #   UNIAUTH_INTERNAL_USERS_0_USERNAME=<name>
  #   UNIAUTH_INTERNAL_USERS_0_PASSWORD={bcrypt}$2a$10$...
  #   UNIAUTH_INTERNAL_USERS_0_ROLES_0=USER
  #   UNIAUTH_INTERNAL_USERS_0_ROLES_1=ADMIN
  #
  # Supply EVERY field: a list bound from environment variables replaces the one here
  # rather than merging with it.
  # ---------------------------------------------------------------------------------------
  internal:
    enabled: true
    display-name: Console account
    users:
      - username: admin
        password: "{noop}admin"
        roles: [ USER, ADMIN ]

  public-paths:
    - /css/**

logging:
  level:
    org.alexmond.uniauth: INFO
