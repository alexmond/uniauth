server:
  port: 8090
  servlet:
    session:
      cookie:
        # Distinct per service. Cookies are scoped by host and NOT by port, so two Spring
        # applications on localhost:8080 and localhost:9000 share one JSESSIONID and each
        # silently overwrites the other's session. In an OAuth redirect that is fatal and
        # almost invisible: the provider's cookie replaces the client's, the client comes
        # back to a session with no saved authorization request, and the login fails with
        # nothing logged but a redirect to ?error.
        name: CONSOLESESSION

spring:
  application:
    name: uniauth-admin
  thymeleaf:
    # The console has no login template of its own — it uses the starter's chooser.
    check-template-location: true

  security:
    oauth2:
      # --- The console AS an OIDC client of the provider it administers ---------------
      #
      # So the console's login page offers the same choice every other service here does,
      # rather than being the one box that only accepts a local password.
      #
      # Endpoints are declared rather than discovered from an issuer-uri: the browser-facing
      # authorization URL and the server-to-server token/JWKS URLs are different addresses
      # on a cluster, and one exact-issuer check cannot hold for both.
      client:
        registration:
          local:
            client-id: uniauth-admin
            client-secret: admin-console-secret
            client-name: Local OAuth
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              # Asked for explicitly. The provider gates the email claims on this scope, so
              # without it the approval queue would show a login with no address — which is
              # the correct outcome for a client that never asked for one.
              - email
        provider:
          local:
            authorization-uri: ${CONSOLE_PROVIDER_PUBLIC_URL:http://localhost:9000}/oauth2/authorize
            token-uri: ${CONSOLE_PROVIDER_BASE_URL:http://localhost:9000}/oauth2/token
            jwk-set-uri: ${CONSOLE_PROVIDER_BASE_URL:http://localhost:9000}/oauth2/jwks
            user-info-uri: ${CONSOLE_PROVIDER_BASE_URL:http://localhost:9000}/userinfo
            user-name-attribute: sub

# What this console administers. Two services, each a flat block rather than a list entry:
# a list bound from environment variables REPLACES the one here instead of merging, so
# supplying one field from a Secret used to blank its siblings silently.
console:
  # The identity provider, over its token-authenticated admin API. The token must match the
  # provider's authserver.admin-api.token.
  provider:
    enabled: true
    name: UniAuth provider
    base-url: ${CONSOLE_PROVIDER_BASE_URL:http://localhost:9000}
    token: ${CONSOLE_PROVIDER_TOKEN:demo-authserver-token}
    path: /admin/api

  # The LDAP directory, written to directly. Needs a bind account with write access —
  # anonymous writes are refused by any directory worth running.
  directory:
    enabled: true
    name: Directory
    url: ${CONSOLE_DIRECTORY_URL:ldap://localhost:389/dc=example,dc=com}
    manager-dn: ${CONSOLE_DIRECTORY_MANAGER_DN:cn=admin,dc=example,dc=com}
    manager-password: ${CONSOLE_DIRECTORY_MANAGER_PASSWORD:admin-pass}
    user-base: ou=people
    user-attribute: uid
    base-dn: dc=example,dc=com

management:
  health:
    # Boot health-checks spring.ldap.* at localhost:389, which this console does not use —
    # it builds its own context source from console.directory.*. Left on, the console
    # reports DOWN over a directory it never talks to.
    ldap:
      enabled: false

uniauth:
  # The console signs its own administrators in with UniAuth. These are a separate
  # population from the users being administered — an account here grants no access to any
  # managed application, and vice versa.
  #
  # ---------------------------------------------------------------------------------------
  # admin/admin is a DEMO credential, and a worse one here than elsewhere in this repo.
  #
  # This console holds a token that creates accounts on every application it manages,
  # including accounts with ADMIN roles. Whoever signs in here can therefore grant
  # themselves administrator on the managed applications — the login below is a privilege
  # escalation path, not just a way into a dashboard.
  #
  # Anywhere that matters, override it with a real password from a Secret or the
  # environment, and use a real encoder:
  #
  #   UNIAUTH_INTERNAL_USERS_0_USERNAME=<name>
  #   UNIAUTH_INTERNAL_USERS_0_PASSWORD={bcrypt}$2a$10$...
  #   UNIAUTH_INTERNAL_USERS_0_ROLES_0=USER
  #   UNIAUTH_INTERNAL_USERS_0_ROLES_1=ADMIN
  #
  # Supply EVERY field: a list bound from environment variables replaces the one here
  # rather than merging with it.
  # ---------------------------------------------------------------------------------------
  internal:
    enabled: true
    display-name: Console account
    users:
      - username: admin
        password: "{noop}admin"
        roles: [ USER, ADMIN ]

  public-paths:
    - /css/**

logging:
  level:
    org.alexmond.uniauth: INFO
