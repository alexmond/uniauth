apiVersion: v2
name: uniauth
description: |
  The UniAuth example web app — a runnable demonstration of the starter: a provider-chooser
  login page, public and protected pages, and the approval queue. This chart deploys the
  demo, not the library; the library itself is a jar and deploys nothing.
type: application
version: 0.1.0
# Tracks the project version: it is the default image tag (scripts/deploy-k8s.sh tags the
# image with the project version) and the app.kubernetes.io/version label. The release
# workflow rewrites it together with the POM versions - do not bump it by hand.
appVersion: "4.0.8.1-SNAPSHOT"
home: https://github.com/alexmond/uniauth
sources:
  - https://github.com/alexmond/uniauth
maintainers:
  - name: Alex Mondshain
