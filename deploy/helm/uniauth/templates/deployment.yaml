apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uniauth.fullname" . }}
  labels:
    {{- include "uniauth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.updateStrategy "Recreate" }}
  # Recreate, not RollingUpdate. These applications hold sessions — and the approval
  # queue — in memory, so a rolling update briefly runs two pods with divergent state:
  # a user approved on one is still pending on the other, and a session established on
  # one is unknown to the other. Brief downtime is the honest trade for a single replica
  # that cannot share state.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "uniauth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uniauth.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "uniauth.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "uniauth.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if ne (int .Values.managementPort) (int .Values.service.port) }}
            - name: management
              containerPort: {{ .Values.managementPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.profiles | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.managementPort | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          # Probes target the management port, because the k8s profile moves actuator off
          # the app port. Point them at http and the pod never goes Ready.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ if ne (int .Values.managementPort) (int .Values.service.port) }}management{{ else }}http{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ if ne (int .Values.managementPort) (int .Values.service.port) }}management{{ else }}http{{ end }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
