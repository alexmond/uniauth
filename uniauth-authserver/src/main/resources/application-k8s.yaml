# Profile for running the provider on a cluster. Activated by the chart
# (SPRING_PROFILES_ACTIVE), which also injects MANAGEMENT_SERVER_PORT to move actuator onto
# its own container port.

server:
  # Back to the chart's port. The default config pins 9000 so the provider can run beside
  # the demo app on one workstation; in a cluster each service has its own address and the
  # chart's containerPort, Service and probes all assume 8080. Leaving 9000 here produces
  # the worst kind of failure: the pod goes Ready — probes watch the management port, which
  # is fine — and every request through the ingress 502s.
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    env:
      show-values: never
  info:
    env:
      enabled: true

info:
  tags:
    environment: ${INFO_ENV_TAG:lab}
