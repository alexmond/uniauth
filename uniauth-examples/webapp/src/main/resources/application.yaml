server:
  servlet:
    session:
      cookie:
        # Distinct per service. Cookies are scoped by host and NOT by port, so two Spring
        # applications on localhost:8080 and localhost:9000 share one JSESSIONID and each
        # silently overwrites the other's session. In an OAuth redirect that is fatal and
        # almost invisible: the provider's cookie replaces the client's, the client comes
        # back to a session with no saved authorization request, and the login fails with
        # nothing logged but a redirect to ?error.
        name: WEBAPPSESSION

spring:
  application:
    name: uniauth-sample

  security:
    oauth2:
      # --- This app AS an OAuth2 client ---------------------------------------------
      # Pointed at uniauth-authserver, which is a separate service now. Endpoints are
      # declared explicitly rather than discovered from an issuer-uri: the browser-facing
      # authorization URL and the server-to-server token/JWKS URLs differ on a cluster, and
      # an exact-issuer check cannot hold for both.
      client:
        registration:
          local:
            client-id: uniauth-demo
            client-secret: demo-secret
            client-name: Local OAuth
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          local:
            # Browser-facing: the user is redirected to the provider here.
            authorization-uri: ${AUTHSERVER_PUBLIC_URL:http://localhost:9000}/oauth2/authorize
            # Server-to-server: this application calling the provider directly.
            token-uri: ${AUTHSERVER_INTERNAL_URL:http://localhost:9000}/oauth2/token
            jwk-set-uri: ${AUTHSERVER_INTERNAL_URL:http://localhost:9000}/oauth2/jwks
            user-info-uri: ${AUTHSERVER_INTERNAL_URL:http://localhost:9000}/userinfo
            user-name-attribute: sub

uniauth:
  # Where a successful sign-in lands. The default is "/", which is this application's
  # PUBLIC overview — so authenticating dropped you on a page that said nothing about
  # having authenticated, and you had to go looking for the dashboard to find out whether
  # anything had happened.
  default-success-url: /dashboard

  # Anything not listed here needs a session. The starter permits its own login page,
  # the providers endpoint, /error and the pending page already.
  public-paths:
    - /
    - /how-it-works
    - /css/**

  # Authenticating and being let in are separate. Directory accounts wait for an
  # administrator; internal accounts do not, because writing one into this file is
  # already an approval. Sign in as bob to land in the queue, then as alice to clear it.
  approval:
    enabled: true
    require-for: [ LDAP, OAUTH2, SAML ]
    pending-page: /pending

  internal:
    enabled: true
    display-name: Local account
    users:
      - username: alice
        password: "{noop}s3cret"
        roles: [ USER, ADMIN ]
      - username: breakglass
        password: "{noop}local-only"
        roles: [ ADMIN ]

  ldap:
    enabled: true
    display-name: Directory account
    url: ${LDAP_URL:ldap://localhost:389/dc=example,dc=com}
    # A bind account for searches. The embedded server was world-readable; a real
    # directory is not — OpenLDAP's default ACL is "by self read ... by * none", and a
    # denied search returns "no such object" rather than admitting the entry exists.
    # Without this, bob authenticates and then comes back with no groups.
    manager-dn: ${LDAP_MANAGER_DN:cn=admin,dc=example,dc=com}
    manager-password: ${LDAP_MANAGER_PASSWORD:admin-pass}
    user-dn-patterns:
      - uid={0},ou=people
    group-search-base: ou=groups

# ---------------------------------------------------------------------------
# OAuth2 and SAML need a real identity provider, so they are left off here.
# UniAuth reads Spring Boot's own registration binding — it does not re-declare
# these properties — so enabling either is just a matter of filling this in.
#
# spring:
#   security:
#     oauth2:
#       client:
#         registration:
#           google:
#             client-id: <id>
#             client-secret: <secret>
#             scope: [ openid, profile, email ]
#     saml2:
#       relyingparty:
#         registration:
#           okta:
#             assertingparty:
#               metadata-uri: https://<tenant>/app/<id>/sso/saml/metadata
# ---------------------------------------------------------------------------

logging:
  level:
    org.alexmond.uniauth: DEBUG

---
# ---------------------------------------------------------------------------------------
# Google, when credentials are supplied. Activate with the "google" profile.
#
# A separate profile document rather than a block with empty defaults, because an empty
# client-id is not ignored — Spring Boot builds a ClientRegistration from it and the
# context fails at startup. Absent registration, absent button; that is the correct
# behaviour for an example nobody has given credentials to.
#
# UniAuth adds nothing here. Everything but the two secrets comes from Boot's own
# CommonOAuth2Provider, keyed on the registration id "google": endpoints, scopes, the
# user-name attribute. That is the whole point of not re-declaring OAuth2 config under
# uniauth.* — and why the chooser, the brand icon and the OIDC detection all light up from
# these two lines.
#
# Setting it up (once, at https://console.cloud.google.com/apis/credentials):
#   1. Create an OAuth 2.0 Client ID, type "Web application".
#   2. Authorised redirect URI: <base>/login/oauth2/code/google
#      Google REQUIRES https for anything that is not localhost, so:
#        local  →  http://localhost:8080/login/oauth2/code/google
#        lab    →  https://<host>/login/oauth2/code/google      (http will be rejected)
#   3. Put the id and secret in GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
#
# A Google account is held by the approval gate like any other OAUTH2 login — it is in
# uniauth.approval.require-for — so the first sign-in lands on /pending until an
# administrator admits it. That is deliberate: a real identity provider will happily vouch
# for anyone with an account, and vouching is not the same as being let in.
# ---------------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
