demo:
  oauth:
    # Browser-facing base URL of this app. The authorization endpoint and the redirect URI
    # must be reachable from the user's browser, so on a cluster this is the ingress URL.
    base-url: http://localhost:8080

spring:
  application:
    name: uniauth-sample

  security:
    oauth2:
      # --- This app AS an OAuth2 provider -------------------------------------------
      # A local authorization server, so the OAUTH2 mechanism is demonstrable with no
      # external identity provider. Accounts live in OAuthUserStore, separate from
      # uniauth.internal.users — seeded with olivia / oauth-pass.
      authorizationserver:
        client:
          uniauth-demo:
            require-authorization-consent: false
            registration:
              client-id: uniauth-demo
              client-secret: "{noop}demo-secret"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - ${demo.oauth.base-url}/login/oauth2/code/local
              scopes:
                - openid
                - profile

      # --- This app AS an OAuth2 client ---------------------------------------------
      # Pointed at the server above. Note there is deliberately NO issuer-uri: setting one
      # would make the client fetch its own discovery document during startup, before the
      # server it is fetching from has started. Declaring the endpoints explicitly avoids
      # that deadlock. (It also means no exact-issuer check on the id_token, which is what
      # lets the browser-facing and in-pod URLs differ below.)
      client:
        registration:
          local:
            client-id: uniauth-demo
            client-secret: demo-secret
            client-name: Local OAuth
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          local:
            # Browser-facing: the user is redirected here.
            authorization-uri: ${demo.oauth.base-url}/oauth2/authorize
            # Server-to-server: this app calling itself. Loopback rather than the public
            # URL, which would leave the pod depending on ingress hairpinning.
            token-uri: http://localhost:8080/oauth2/token
            jwk-set-uri: http://localhost:8080/oauth2/jwks
            user-info-uri: http://localhost:8080/userinfo
            user-name-attribute: sub

  # An in-process directory, so the LDAP path works with nothing else running.
  # A real deployment points uniauth.ldap.url at its own server and deletes this block.
  ldap:
    embedded:
      base-dn: dc=example,dc=com
      ldif: classpath:sample-directory.ldif
      port: 18389

uniauth:
  # Anything not listed here needs a session. The starter permits its own login page,
  # the providers endpoint, /error and the pending page already.
  public-paths:
    - /
    - /how-it-works
    - /css/**

  # Lets the standalone uniauth-admin console manage this application's stores over HTTP.
  # A demo token, like the demo passwords — override it anywhere it matters. The API
  # refuses to start without one rather than defaulting to something guessable.
  admin-api:
    enabled: true
    token: ${UNIAUTH_ADMIN_API_TOKEN:demo-admin-token}

  # Authenticating and being let in are separate. Directory accounts wait for an
  # administrator; internal accounts do not, because writing one into this file is
  # already an approval. Sign in as bob to land in the queue, then as alice to clear it.
  approval:
    enabled: true
    require-for: [ LDAP, OAUTH2, SAML ]
    pending-page: /pending

  internal:
    enabled: true
    display-name: Local account
    users:
      - username: alice
        password: "{noop}s3cret"
        roles: [ USER, ADMIN ]
      - username: breakglass
        password: "{noop}local-only"
        roles: [ ADMIN ]

  ldap:
    enabled: true
    display-name: Directory account
    url: ldap://localhost:18389/dc=example,dc=com
    user-dn-patterns:
      - uid={0},ou=people
    group-search-base: ou=groups

# ---------------------------------------------------------------------------
# OAuth2 and SAML need a real identity provider, so they are left off here.
# UniAuth reads Spring Boot's own registration binding — it does not re-declare
# these properties — so enabling either is just a matter of filling this in.
#
# spring:
#   security:
#     oauth2:
#       client:
#         registration:
#           google:
#             client-id: <id>
#             client-secret: <secret>
#             scope: [ openid, profile, email ]
#     saml2:
#       relyingparty:
#         registration:
#           okta:
#             assertingparty:
#               metadata-uri: https://<tenant>/app/<id>/sso/saml/metadata
# ---------------------------------------------------------------------------

logging:
  level:
    org.alexmond.uniauth: DEBUG
