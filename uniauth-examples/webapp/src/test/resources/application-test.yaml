# Test-only overlay, activated by @ActiveProfiles("test").
#
# A PROFILE document, deliberately — not a second application.yaml. Boot resolves
# classpath:/application.yaml to the FIRST match on the classpath, and target/test-classes
# comes before target/classes, so a same-named file does not add to the application's
# configuration, it replaces it wholesale. That took the internal accounts, the public
# paths and the approval gate with it, and the tests failed on a missing ApprovalStore bean
# rather than on anything to do with LDAP.
#
# The directory is a real service now, so the application does not embed one. Tests still
# need something to bind against, and an in-process UnboundID server is the right shape for
# that: a fixture, not a feature. unboundid-ldapsdk is test-scoped for exactly this reason.
spring:
  ldap:
    embedded:
      base-dn: dc=example,dc=com
      ldif: classpath:sample-directory.ldif
      port: 18389

uniauth:
  ldap:
    # No bind account: the in-process server has no admin entry and reads anonymously.
    manager-dn: ""
    manager-password: ""
    url: ldap://localhost:18389/dc=example,dc=com
