# Test-only configuration.
#
# The directory is a real service now, so the application does not embed one. Tests still
# need something to bind against, and an in-process UnboundID server is the right shape for
# that: a fixture, not a feature. unboundid-ldapsdk is a test-scoped dependency for exactly
# this reason.
spring:
  ldap:
    embedded:
      base-dn: dc=example,dc=com
      ldif: classpath:sample-directory.ldif
      port: 18390

uniauth:
  ldap:
    # No bind account: the in-process server has no admin entry and reads anonymously.
    manager-dn: ""
    manager-password: ""
    url: ldap://localhost:18390/dc=example,dc=com
