spring:
  application:
    name: uniauth-headless-example


uniauth:
  # No public pages here — the only thing served without a session is the providers
  # endpoint, which the starter permits already. A real front end is static files
  # hosted elsewhere, so there is nothing else to open up.
  internal:
    enabled: true
    display-name: Local account
    users:
      - username: alice
        password: "{noop}s3cret"
        roles: [ USER, ADMIN ]

  ldap:
    enabled: true
    display-name: Directory account
    url: ${LDAP_URL:ldap://localhost:389/dc=example,dc=com}
    # A bind account for searches. The embedded server was world-readable; a real
    # directory is not — OpenLDAP's default ACL is "by self read ... by * none", and a
    # denied search returns "no such object" rather than admitting the entry exists.
    # Without this, bob authenticates and then comes back with no groups.
    manager-dn: ${LDAP_MANAGER_DN:cn=admin,dc=example,dc=com}
    manager-password: ${LDAP_MANAGER_PASSWORD:admin-pass}
    user-dn-patterns:
      - uid={0},ou=people
    group-search-base: ou=groups

# The form login still exists — a JSON client can POST to /login with username and
# password. It is the redirect-based providers that need the front end to send the
# browser to their loginUrl from /uniauth/providers.

logging:
  level:
    org.alexmond.uniauth: DEBUG
